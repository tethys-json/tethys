name: Scala CI

on:
  push:
    branches: [ master ]
    tags: [ v* ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        scala: [2.12.21, 2.13.18, 3.3.4]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17.0.21
          check-latest: true
      - name: Verify Java trust store
        shell: bash
        run: |
          # Temurin reissued some builds under the same version; reject stale cached stores.
          certs="$("$JAVA_HOME/bin/keytool" -J-Duser.language=en -list -v -cacerts -storepass changeit)"
          if printf '%s\n' "$certs" | grep -Ei '^Owner:.*(emSign (ECC Root CA - G3|Root CA - G2)|AAA Certificate Services)' > /dev/null; then
            echo "Compromised eMudhra trust path remains in the JDK" >&2
            exit 1
          fi
      - uses: sbt/setup-sbt@v1
      - name: Test
        run: sbt ++${{matrix.scala}} test
      
  fmt:
    name: Fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17.0.21
          check-latest: true
      - name: Verify Java trust store
        shell: bash
        run: |
          # Temurin reissued some builds under the same version; reject stale cached stores.
          certs="$("$JAVA_HOME/bin/keytool" -J-Duser.language=en -list -v -cacerts -storepass changeit)"
          if printf '%s\n' "$certs" | grep -Ei '^Owner:.*(emSign (ECC Root CA - G3|Root CA - G2)|AAA Certificate Services)' > /dev/null; then
            echo "Compromised eMudhra trust path remains in the JDK" >&2
            exit 1
          fi
      - uses: sbt/setup-sbt@v1
      - name: Fmt
        run: sbt "scalafmtCheckAll;scalafmtSbtCheck"
  
  publish:
    name: Publish Artifacts
    needs: [test]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17.0.21
          check-latest: true
      - name: Verify Java trust store
        shell: bash
        run: |
          # Temurin reissued some builds under the same version; reject stale cached stores.
          certs="$("$JAVA_HOME/bin/keytool" -J-Duser.language=en -list -v -cacerts -storepass changeit)"
          if printf '%s\n' "$certs" | grep -Ei '^Owner:.*(emSign (ECC Root CA - G3|Root CA - G2)|AAA Certificate Services)' > /dev/null; then
            echo "Compromised eMudhra trust path remains in the JDK" >&2
            exit 1
          fi
      - uses: sbt/setup-sbt@v1
      - name: coursier-cache
        uses: coursier/cache-action@v6
      - name: Publish artifacts
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
        run: sbt ci-release
